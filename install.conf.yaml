- defaults:
    link:
      create: true
      relink: true

- clean: ['~']

- link:
    ~/.zprofile: zprofile
    ~/.zshrc: zshrc
    ~/.hushlogin: hushlogin
    ~/.config/starship.toml: starship.toml
    ~/.config/nvim: nvim
    ~/.config/opencode/opencode.jsonc: opencode/opencode.jsonc

- create:
    - ~/projects

- shell:
  - [git submodule update --init --recursive, Installing submodules]
