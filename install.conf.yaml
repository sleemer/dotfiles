- defaults:
    link:
      create: true
      relink: true

- clean: ['~']

- link:
    ~/.zprofile: zprofile
    ~/.zshrc: zshrc
    ~/.hushlogin: hushlogin
    ~/.config/starship.toml: starship.toml
    ~/.config/nvim: nvim

- create:
    - ~/projects

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  # brew is called by full path: Homebrew isn't on PATH until a new shell loads ~/.zprofile
  - command: >-
      /opt/homebrew/bin/brew trust --formula azure/kubelogin/kubelogin &&
      /opt/homebrew/bin/brew bundle --file=Brewfile --no-upgrade
    description: Installing Homebrew packages
    stdin: true
    stdout: true
    stderr: true
