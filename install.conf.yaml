- defaults:
    link:
      create: true
      relink: true

- clean: ['~']

- link:
    ~/.zprofile: zprofile
    ~/.zshrc: zshrc
    ~/.hushlogin: hushlogin
    ~/.config/starship.toml: starship.toml
    ~/.config/nvim: nvim

- create:
    - ~/projects

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  # brew is called by full path: Homebrew isn't on PATH until a new shell loads ~/.zprofile
  - command: >-
      /opt/homebrew/bin/brew trust --formula azure/kubelogin/kubelogin &&
      /opt/homebrew/bin/brew bundle --file=Brewfile --no-upgrade
    description: Installing Homebrew packages
    stdin: true
    stdout: true
    stderr: true
  # Language server for Claude Code's csharp-lsp plugin; ~/.dotnet/tools is on PATH via zshrc
  - command: >-
      /usr/local/share/dotnet/dotnet tool list -g | grep -q csharp-ls ||
      /usr/local/share/dotnet/dotnet tool install -g csharp-ls
    description: Installing csharp-ls
    stdout: true
    stderr: true
  # Language server for the jsonnet-lsp plugin below; ~/go/bin is on PATH via zshrc
  - command: >-
      [ -x ~/go/bin/jsonnet-language-server ] ||
      /opt/homebrew/bin/go install github.com/grafana/jsonnet-language-server@latest
    description: Installing jsonnet-language-server
    stdout: true
    stderr: true
  - command: >-
      /opt/homebrew/bin/claude plugin marketplace add ~/.dotfiles/claude-plugins &&
      /opt/homebrew/bin/claude plugin install jsonnet-lsp@sleemer
    description: Installing Claude Code plugins from claude-plugins
    stdout: true
    stderr: true
